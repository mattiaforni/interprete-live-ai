<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sottotitoli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cossette+Texte:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --size: 5.5vh;      /* altezza del carattere */
    --lines: 2;         /* righe visibili */
    --offset: 8vh;      /* distanza dal bordo (alta/bassa) */
    --lh: 1.25;
    --font: "Cossette Texte", Tahoma, "Trebuchet MS", sans-serif;
    --azzurro: #D3EBF1; --mattone: #61180C; --corallo: #E95D6D;
  }
  /* --- temi: sfondo pagina / fascia / testo / bordo --- */
  html[data-theme="scuro"]        { --bg:#000;          --band:#141414;       --fg:#fff;            --border:#333;           --font: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  html[data-theme="chiaro"]       { --bg:#fff;          --band:#f1f1f1;       --fg:#111;            --border:#ccc;           --font: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  html[data-theme="test-azzurro"] { --bg:var(--azzurro); --band:var(--azzurro); --fg:var(--mattone);  --border:var(--mattone); }
  html[data-theme="test-mattone"] { --bg:var(--azzurro); --band:var(--mattone); --fg:var(--azzurro);  --border:var(--mattone); }
  html[data-theme="test-notte"]   { --bg:#000;          --band:var(--mattone); --fg:var(--azzurro);  --border:var(--azzurro); }
  html[data-theme="test-corallo"] { --bg:var(--azzurro); --band:var(--corallo); --fg:#fff;            --border:var(--mattone); }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font: 700 var(--size)/var(--lh) var(--font); letter-spacing: -0.02em; }

  /* La fascia: una riga della griglia, bordata sopra e sotto 1px */
  #band {
    position: absolute; left: 0; right: 0;
    background: var(--band); color: var(--fg);
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    padding: 0.45em 4vw;
    transition: opacity .4s;
  }
  #band.pos-bassa { bottom: var(--offset); }
  #band.pos-alta  { top: var(--offset); }
  #band.pos-media { top: 50%; transform: translateY(-50%); }
  #band.box { left: 4vw; right: 4vw; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  #band.idle { opacity: 0; }
  #band.always { opacity: 1; }

  /* Il testo: esattamente N righe, ancorato in basso così si vede la coda */
  #text {
    height: calc(var(--lines) * var(--lh) * 1em);
    display: flex; align-items: flex-end; overflow: hidden;
  }
  #inner { display: block; width: 100%; text-wrap: pretty; }
  #text span.partial { opacity: .78; }

  /* --- pannello impostazioni --- */
  #hint { position: absolute; top: 10px; right: 14px; font: 13px/1.4 system-ui, sans-serif; letter-spacing: 0; color: var(--fg); opacity: .6; transition: opacity 1s; pointer-events: none; }
  #hint.hide { opacity: 0; }
  #dot { position: absolute; top: 12px; left: 14px; width: 10px; height: 10px; border-radius: 50%; background: #3ccb7f; opacity: 0; transition: opacity .4s; }
  #dot.on { opacity: .9; }
  #panel {
    position: absolute; top: 40px; right: 14px; width: 340px; max-height: calc(100% - 60px); overflow: auto;
    background: #1a1d24; color: #e8e9ec; border: 1px solid #2a2f3a; border-radius: 8px; padding: 14px 16px;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0; display: none;
  }
  #panel.open { display: block; }
  #panel h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
  #panel label { display: block; font-size: 11px; color: #8b919e; text-transform: uppercase; letter-spacing: .04em; margin: 10px 0 4px; }
  #panel select, #panel input[type=range] { width: 100%; background: #111318; color: #e8e9ec; border: 1px solid #2a2f3a; border-radius: 6px; padding: 6px 8px; font: inherit; }
  #panel input[type=range] { padding: 0; }
  #panel .row { display: flex; gap: 8px; align-items: center; }
  #panel .row > * { flex: 1; }
  #panel .keys { margin-top: 12px; font-size: 12px; color: #8b919e; }
  #panel kbd { background: #111318; border: 1px solid #2a2f3a; border-radius: 4px; padding: 0 5px; font: 11px ui-monospace, monospace; }
  #panel .chk { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
</style>
</head>
<body>
<div id="dot" title="audio in arrivo"></div>
<div id="hint">S impostazioni · F tutto schermo</div>
<div id="band" class="pos-bassa idle"><div id="text"><div id="inner"></div></div></div>

<div id="panel">
  <h3>Schermo sottotitoli</h3>
  <label>Cosa mostrare</label>
  <select id="s_lang">
    <option value="it">Traduzione italiana</option>
    <option value="fr">Traduzione francese</option>
    <option value="en">Traduzione inglese</option>
    <option value="orig">Trascrizione originale (lingua parlata)</option>
  </select>
  <label>Posizione fascia</label>
  <select id="s_pos"><option value="bassa">Bassa</option><option value="media">Media</option><option value="alta">Alta</option></select>
  <div class="row">
    <div><label>Righe</label><select id="s_lines"><option>1</option><option>2</option><option>3</option></select></div>
    <div><label>Dimensione</label><input id="s_size" type="range" min="2.5" max="12" step="0.25"></div>
  </div>
  <label>Tema</label>
  <select id="s_theme">
    <option value="test-azzurro">TEST — azzurro, testo mattone</option>
    <option value="test-mattone">TEST — fascia mattone su azzurro</option>
    <option value="test-notte">TEST — fascia mattone su nero</option>
    <option value="test-corallo">TEST — fascia corallo</option>
    <option value="scuro">Neutro scuro</option>
    <option value="chiaro">Neutro chiaro</option>
  </select>
  <div class="chk"><input type="checkbox" id="s_box"><label for="s_box" style="margin:0;text-transform:none;font-size:14px;color:#e8e9ec">Fascia a riquadro (non a tutta larghezza)</label></div>
  <div class="chk"><input type="checkbox" id="s_always"><label for="s_always" style="margin:0;text-transform:none;font-size:14px;color:#e8e9ec">Fascia sempre visibile (anche in silenzio)</label></div>
  <label>Sorgente</label>
  <select id="s_src"><option value="local">PC operatore (stesso browser)</option><option value="firebase">Relay Firebase</option></select>
  <div class="keys">Tasti: <kbd>S</kbd> pannello · <kbd>F</kbd> tutto schermo · <kbd>↑</kbd><kbd>↓</kbd> sposta la fascia · <kbd>+</kbd><kbd>−</kbd> dimensione · <kbd>C</kbd> cancella</div>
</div>

<script src="firebase-config.js"></script>
<script type="module">
import { initFirebase, subscribe } from './js/relay.js';

const q = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const band = $('band'), text = $('text'), dot = $('dot');

// --- impostazioni: URL > localStorage > default
const DEF = { lang: 'it', pos: 'bassa', lines: 2, size: 5.5, theme: 'test-azzurro', box: false, always: false, src: 'local', offset: 8, evento: 'evento-finale' };
const saved = JSON.parse(localStorage.getItem('schermo') || '{}');
const S = { ...DEF, ...saved };
for (const k of Object.keys(DEF)) if (q.has(k)) S[k] = q.get(k);
S.lines = +S.lines; S.size = +S.size; S.offset = +S.offset;
S.box = S.box === true || S.box === '1' || S.box === 'true';
S.always = S.always === true || S.always === '1' || S.always === 'true';

function apply() {
  const r = document.documentElement;
  r.dataset.theme = S.theme;
  r.style.setProperty('--size', S.size + 'vh');
  r.style.setProperty('--lines', S.lines);
  r.style.setProperty('--offset', S.offset + 'vh');
  band.className = `pos-${S.pos}` + (S.box ? ' box' : '') + (S.always ? ' always' : '') + (band.classList.contains('idle') ? ' idle' : '');
  document.title = `Sottotitoli ${S.lang.toUpperCase()}`;
  localStorage.setItem('schermo', JSON.stringify(S));
  $('s_lang').value = S.lang; $('s_pos').value = S.pos; $('s_lines').value = S.lines; $('s_size').value = S.size;
  $('s_theme').value = S.theme; $('s_box').checked = S.box; $('s_always').checked = S.always; $('s_src').value = S.src;
  render();
}

// --- testo scorrevole "da streaming": ultime righe finali + riga in corso, tagliate dalla testa
let finals = [];       // ultime righe concluse
let partial = '';      // riga in corso
let idleTimer = null;
const IDLE_MS = 6000;  // dopo 6 s di silenzio la fascia sparisce (se non "sempre visibile")

function budget() {
  // caratteri che stanno in N righe, misurati sul font corrente
  const c = document.createElement('canvas').getContext('2d');
  const px = window.innerHeight * S.size / 100;
  c.font = `700 ${px}px ${getComputedStyle(document.body).fontFamily}`;
  const sample = 'Il progetto nasce da una collaborazione tra città europee e cittadini ';
  const avg = c.measureText(sample).width / sample.length;
  const width = text.clientWidth || window.innerWidth * 0.92;
  return Math.floor(width / avg) * S.lines;
}

function render() {
  const max = budget();
  let s = finals.join(' ');
  let p = partial;
  // taglia dalla testa finché non ci sta
  while ((s + ' ' + p).trim().length > max) {
    if (s) { const i = s.indexOf(' '); s = i < 0 ? '' : s.slice(i + 1); }
    else { const i = p.indexOf(' '); if (i < 0) break; p = p.slice(i + 1); }
  }
  const inner = $('inner');
  inner.innerHTML = '';
  if (s) inner.append(s + (p ? ' ' : ''));
  if (p) { const sp = document.createElement('span'); sp.className = 'partial'; sp.textContent = p; inner.append(sp); }
  band.classList.toggle('idle', !s && !p);
}

function show(t, final) {
  if (t === '' && !final) { partial = ''; render(); return; } // riga ritirata (filtro echo)
  if (final) { finals.push(t); if (finals.length > 4) finals.shift(); partial = ''; }
  else partial = t;
  render();
  dot.classList.add('on'); clearTimeout(dot._t); dot._t = setTimeout(() => dot.classList.remove('on'), 1200);
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { finals = []; partial = ''; render(); }, IDLE_MS);
}

// --- sorgente
let unsub = null;
function connect() {
  if (unsub) { unsub(); unsub = null; }
  if (S.src === 'firebase') {
    initFirebase().then((db) => {
      if (!db) { show('Relay Firebase non configurato', true); return; }
      unsub = subscribe(S.evento, S.lang, { onCurrent: (t) => { if (t) show(t, false); }, onLine: (l) => show(l.text, true) });
    }).catch((e) => show('Firebase: ' + e.message, true));
  } else {
    const bc = new BroadcastChannel('interprete-live');
    bc.onmessage = (e) => { if (e.data.lang === S.lang) show(e.data.text, e.data.final); };
    unsub = () => bc.close();
  }
}

// --- pannello e tasti
const panel = $('panel');
const bind = (id, key, conv = (v) => v, reconnect = false) => $(id).addEventListener('change', (e) => {
  S[key] = conv(e.target.type === 'checkbox' ? e.target.checked : e.target.value);
  finals = []; partial = ''; apply(); if (reconnect) connect();
});
bind('s_lang', 'lang', (v) => v, true);
bind('s_pos', 'pos');
bind('s_lines', 'lines', Number);
bind('s_size', 'size', Number);
bind('s_theme', 'theme');
bind('s_box', 'box');
bind('s_always', 'always');
bind('s_src', 'src', (v) => v, true);
$('s_size').addEventListener('input', (e) => { S.size = +e.target.value; apply(); });

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 's') panel.classList.toggle('open');
  else if (k === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (k === '+' || k === '=') { S.size = Math.min(12, S.size + 0.25); apply(); }
  else if (k === '-') { S.size = Math.max(2.5, S.size - 0.25); apply(); }
  else if (k === 'arrowup') { S.offset = Math.min(60, S.offset + (S.pos === 'alta' ? -1 : 1)); apply(); }
  else if (k === 'arrowdown') { S.offset = Math.max(0, S.offset + (S.pos === 'alta' ? 1 : -1)); apply(); }
  else if (k === 'c') { finals = []; partial = ''; render(); }
  else if (k === 'escape') panel.classList.remove('open');
});
window.addEventListener('resize', render);
document.addEventListener('mousemove', () => { const h = $('hint'); h.classList.remove('hide'); clearTimeout(h._t); h._t = setTimeout(() => h.classList.add('hide'), 3000); });
setTimeout(() => $('hint').classList.add('hide'), 6000);

apply();
connect();
</script>
</body>
</html>
