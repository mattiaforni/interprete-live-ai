<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sottotitoli</title>
<style>
  :root { --bg: #000; --fg: #fff; --dim: #9a9a9a; --size: 6vh; --lines: 3; }
  html[data-theme="light"] { --bg: #fff; --fg: #111; --dim: #777; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font: 500 var(--size)/1.3 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  #box { position: absolute; left: 4vw; right: 4vw; bottom: 6vh; display: flex; flex-direction: column; justify-content: flex-end; gap: .35em; text-wrap: balance; }
  #box p { margin: 0; }
  #box p.partial { color: var(--dim); }
  #box.lower { bottom: 0; left: 0; right: 0; padding: .6em 4vw; background: rgba(0,0,0,.75); }
  #hint { position: absolute; top: 12px; right: 16px; font-size: 14px; color: var(--dim); opacity: .8; transition: opacity 1s; }
  #hint.hide { opacity: 0; }
  #idle { position: absolute; top: 12px; left: 16px; width: 12px; height: 12px; border-radius: 50%; background: #3ccb7f; opacity: 0; transition: opacity .5s; }
  #idle.on { opacity: .9; }
</style>
</head>
<body>
<div id="idle" title="audio in arrivo"></div>
<div id="hint">F tutto schermo · + / − dimensione · T tema · L fascia bassa · C cancella</div>
<div id="box"></div>
<script src="firebase-config.js"></script>
<script type="module">
import { initFirebase, subscribe } from './js/relay.js';

const q = new URLSearchParams(location.search);
const lang = q.get('lang') || 'it';
const src = q.get('src') || 'local';          // local = BroadcastChannel dal PC operatore; firebase = relay
const evento = q.get('evento') || 'evento-finale';
let lines = parseInt(q.get('lines') || localStorage.getItem('scr_lines') || '3', 10);
let size = parseFloat(q.get('size') || localStorage.getItem('scr_size') || '6');
let theme = q.get('theme') || localStorage.getItem('scr_theme') || 'dark';
let lower = q.get('lower') === '1';

document.title = `Sottotitoli ${lang.toUpperCase()}`;
const box = document.getElementById('box');
const idle = document.getElementById('idle');
let partialEl = null;
let idleTimer = null;

function apply() {
  document.documentElement.style.setProperty('--size', size + 'vh');
  document.documentElement.dataset.theme = theme;
  box.classList.toggle('lower', lower);
  localStorage.setItem('scr_size', size); localStorage.setItem('scr_theme', theme); localStorage.setItem('scr_lines', lines);
}
apply();

function show(text, final) {
  if (!partialEl) { partialEl = document.createElement('p'); partialEl.className = 'partial'; box.appendChild(partialEl); }
  partialEl.textContent = text;
  if (final) { partialEl.className = ''; partialEl = null; }
  // Teniamo solo le ultime N righe concluse + quella in corso.
  const done = [...box.querySelectorAll('p:not(.partial)')];
  while (done.length > lines) box.removeChild(done.shift());
  idle.classList.add('on');
  clearTimeout(idleTimer); idleTimer = setTimeout(() => idle.classList.remove('on'), 1500);
}

if (src === 'firebase') {
  initFirebase().then(() => subscribe(evento, lang, {
    onCurrent: (t) => { if (t) show(t, false); },
    onLine: (l) => show(l.text, true),
  })).catch((e) => show('Firebase: ' + e.message, true));
} else {
  const bc = new BroadcastChannel('interprete-live');
  bc.onmessage = (e) => { if (e.data.lang === lang) show(e.data.text, e.data.final); };
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (e.key === '+' || e.key === '=') { size = Math.min(14, size + 0.5); apply(); }
  else if (e.key === '-') { size = Math.max(2, size - 0.5); apply(); }
  else if (e.key === 't' || e.key === 'T') { theme = theme === 'dark' ? 'light' : 'dark'; apply(); }
  else if (e.key === 'l' || e.key === 'L') { lower = !lower; apply(); }
  else if (e.key === 'c' || e.key === 'C') { box.innerHTML = ''; partialEl = null; }
  else if (e.key >= '1' && e.key <= '6') { lines = +e.key; apply(); }
});
setTimeout(() => document.getElementById('hint').classList.add('hide'), 6000);
document.addEventListener('mousemove', () => { const h = document.getElementById('hint'); h.classList.remove('hide'); clearTimeout(h._t); h._t = setTimeout(() => h.classList.add('hide'), 3000); });
</script>
</body>
</html>
